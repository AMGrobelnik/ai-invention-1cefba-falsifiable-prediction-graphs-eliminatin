[project]
name = "gen_art_dataset_1"
version = "1.0.0"
description = "Agent Falsifiability Benchmark Suite dataset artifact"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "requests==2.34.2",
    "pydantic==2.13.4",
    "jsonschema==4.26.0"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
